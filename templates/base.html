<!doctype html>
<html lang="{{ lang }}" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ config.title }}{% endblock %}</title>
  {% if config.extra.favicon %}
  <link rel="icon" href="{{ get_url(path=config.extra.favicon) }}">
  {% elif config.extra.profile_avatar %}
  <link rel="icon" href="{{ get_url(path=config.extra.profile_avatar) }}">
  {% endif %}
  <link rel="stylesheet" href="{{ get_url(path='light.css', cachebust=true) }}" id="theme-light">
  <link rel="stylesheet" href="{{ get_url(path='dark.css', cachebust=true) }}" id="theme-dark" disabled>
  <link rel="preload" href="{{ get_url(path='fonts/SarasaMonoSC-Regular.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ get_url(path='fonts/SarasaMonoSC-Bold.woff2') }}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{{ get_url(path='dark.css', cachebust=true) }}" as="style">
  <link rel="stylesheet" href="{{ get_url(path='lib/font-awesome/css/all.min.css') }}">
  <script>
    (function () {
      var stored = localStorage.getItem("theme");
      var dark = stored ? stored === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = dark ? "dark" : "light";
      document.getElementById("theme-light").disabled = dark;
      document.getElementById("theme-dark").disabled = !dark;
    })();
  </script>
</head>
<body class="max-width mx-auto px3 ltr">
  <div class="content index py4">
    {% include "partials/header.html" %}
    <main>
      {% block content %}{% endblock %}
    </main>
    {% include "partials/footer.html" %}
  </div>
  <script src="{{ get_url(path='js/main.js') }}" defer></script>
</body>
</html>
