<header id="header">
  <a href="{{ config.base_url }}">
    <div id="title">
      <h1>{{ config.title }}</h1>
    </div>
  </a>
  <div id="nav">
    <ul>
      {% for item in config.extra.menu | default(value=[]) %}
      <li><a href="{{ item.url | safe }}">{{ item.name }}</a></li>
      {% endfor %}
    </ul>
  </div>
  <button id="theme-toggle" type="button" aria-label="Toggle theme">
    <svg class="sun" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="6"></circle>
      <path d="M12 2v1M12 21v1M4.2 4.2l.7.7M19.1 19.1l.7.7M2 12h1M21 12h1M4.2 19.8l.7-.7M19.1 4.9l.7-.7"></path>
    </svg>
    <svg class="moon" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24">
      <path d="M12 3c.132 0 .263 0 .393 0a7.5 7.5 0 0 0 7.92 12.446a9 9 0 1 1-8.313-12.454z"></path>
      <path d="M17 4a2 2 0 0 0 2 2a2 2 0 0 0-2 2a2 2 0 0 0-2-2a2 2 0 0 0 2-2"></path>
      <path d="M19 11h2m-1-1v2"></path>
    </svg>
  </button>
</header>
